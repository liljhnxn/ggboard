<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c130d" />
      <stop offset="55%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#07080b" />
    </radialGradient>

    <!-- Orange Gradient -->
    <linearGradient id="ggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#d93800" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100" />
      <stop offset="100%" stop-color="#ff3700" />
    </linearGradient>

    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Cyber Grid Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>

  <!-- Hexagonal / Shield Cyber Ring -->
  <polygon points="256,42 432,144 432,368 256,470 80,368 80,144" fill="none" stroke="#242938" stroke-width="6" />
  <polygon points="256,58 418,152 418,360 256,454 94,360 94,152" fill="none" stroke="url(#neonRim)" stroke-width="3" opacity="0.6" />

  <!-- Corner Tech Accents -->
  <circle cx="256" cy="58" r="5" fill="#ff6200" filter="url(#softGlow)" />
  <circle cx="418" cy="152" r="5" fill="#ff6200" filter="url(#softGlow)" />
  <circle cx="418" cy="360" r="5" fill="#ff6200" filter="url(#softGlow)" />
  <circle cx="256" cy="454" r="5" fill="#ff6200" filter="url(#softGlow)" />
  <circle cx="94" cy="360" r="5" fill="#ff6200" filter="url(#softGlow)" />
  <circle cx="94" cy="152" r="5" fill="#ff6200" filter="url(#softGlow)" />

  <!-- Inner Ambient Glow Sphere -->
  <circle cx="256" cy="256" r="130" fill="#ff5500" opacity="0.15" filter="url(#orangeGlow)" />

  <!-- Central 'GG' Esports Monogram -->
  <g filter="url(#orangeGlow)" transform="translate(0, 10)">
    <!-- First 'G' -->
    <path d="M 230 180 L 155 180 C 130 180 115 195 115 225 L 115 285 C 115 315 130 330 155 330 L 225 330 C 245 330 255 315 255 290 L 255 250 L 185 250 L 185 275 L 225 275 L 225 295 C 225 305 220 308 210 308 L 160 308 C 145 308 140 300 140 285 L 140 225 C 140 210 145 202 160 202 L 230 202 Z" fill="url(#ggGrad)" />

    <!-- Second 'G' -->
    <path d="M 395 180 L 320 180 C 295 180 280 195 280 225 L 280 285 C 280 315 295 330 320 330 L 390 330 C 410 330 420 315 420 290 L 420 250 L 350 250 L 350 275 L 390 275 L 390 295 C 390 305 385 308 375 308 L 325 308 C 310 308 305 300 305 285 L 305 225 C 305 210 310 202 325 202 L 395 202 Z" fill="url(#ggGrad)" />
  </g>

  <!-- BOT Chain Mainnet Subtext / Pill -->
  <g transform="translate(186, 370)">
    <rect width="140" height="26" rx="13" fill="#141824" stroke="#ff6200" stroke-width="1.2" opacity="0.9" />
    <text x="70" y="17" fill="#f4f5f7" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="2" text-anchor="middle">BOTCHAIN</text>
  </g>
</svg>

